spring.application.name=portfolio-backend

server.port=${PORT:8080}

# Fallback to localhost if DB_URL isn't set (local development)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/portfolio}
spring.datasource.username=${DB_USER:teja}
spring.datasource.password=${DB_PASSWORD:Teja@9618}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Force Hibernate to know it's MySQL even if the connection drops or lags during startup
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect